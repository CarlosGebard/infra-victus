docker_apt_arch_map:
  x86_64: amd64
  aarch64: arm64

grafana_apt_arch_map:
  x86_64: amd64
  aarch64: arm64

tailscale:
  enabled: true
  auth_key: "{{ lookup('ansible.builtin.env', 'TAILSCALE_AUTH_KEY') | default('', true) }}"
  advertise_tags:
    - tag:vps
  enable_ssh: false
  hostname: infra-victus-vps
  args_extra: ""
  track: stable

observability:
  alloy:
    http_listen_addr: 0.0.0.0:12345
    storage_path: /var/lib/alloy/data
    loki_write_url: http://127.0.0.1:3100/loki/api/v1/push
