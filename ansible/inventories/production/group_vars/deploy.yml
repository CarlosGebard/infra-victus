shared_docker_networks:
  - infra_shared_backend

deploy:
  core:
    name: core
    project_dir: "{{ srv_apps_root }}/core"
    compose_src: "{{ playbook_dir }}/../../compose/projects/core/docker-compose.yml"
    compose_path: "{{ srv_apps_root }}/core/docker-compose.yml"
    env_path: "{{ srv_secrets_root }}/runtime/core.env"
    directories:
      - { path: "{{ srv_apps_root }}/core/nginx/conf.d", mode: "0755" }
      - { path: "{{ srv_apps_root }}/core/nginx/acme", mode: "0755" }
    staged_secret_files:
      - source_file: "{{ lookup('ansible.builtin.env', 'CORE_RUNTIME_ENV_SOURCE_FILE') | default('', true) }}"
        dest: "{{ srv_secrets_root }}/runtime/core.env"
        mode: "0600"
      - source_file: "{{ lookup('ansible.builtin.env', 'CORE_RUNTIME_SEAWEED_S3_SOURCE_FILE') | default('', true) }}"
        dest: "{{ srv_secrets_root }}/runtime/seaweed-s3.json"
        mode: "0600"
    required_files:
      - "{{ srv_secrets_root }}/runtime/core.env"
      - "{{ srv_secrets_root }}/runtime/seaweed-s3.json"
    config_files:
      - src: "{{ playbook_dir }}/../../compose/configs/nginx/nginx.conf"
        dest: "{{ srv_apps_root }}/core/nginx/nginx.conf"

  personal:
    name: personal
    project_dir: "{{ srv_apps_root }}/personal"
    compose_src: "{{ playbook_dir }}/../../compose/projects/personal/docker-compose.yml"
    compose_path: "{{ srv_apps_root }}/personal/docker-compose.yml"
    env_path: "{{ srv_secrets_root }}/runtime/personal.env"
    directories:
      - { path: "{{ srv_apps_root }}/personal/couchdb/local.d", mode: "0755" }
    staged_secret_files:
      - source_file: "{{ lookup('ansible.builtin.env', 'PERSONAL_RUNTIME_ENV_SOURCE_FILE') | default('', true) }}"
        dest: "{{ srv_secrets_root }}/runtime/personal.env"
        mode: "0600"
    required_files:
      - "{{ srv_secrets_root }}/runtime/personal.env"
    config_files:
      - src: "{{ playbook_dir }}/../../compose/configs/couchdb/local.d/local.ini"
        dest: "{{ srv_apps_root }}/personal/couchdb/local.d/local.ini"

  observability:
    name: observability
    project_dir: "{{ srv_apps_root }}/observability"
    compose_src: "{{ playbook_dir }}/../../compose/projects/observability/docker-compose.yml"
    compose_path: "{{ srv_apps_root }}/observability/docker-compose.yml"
    env_path: "{{ srv_secrets_root }}/runtime/observability.env"
    directories:
      - { path: "{{ srv_apps_root }}/observability/loki", mode: "0755" }
      - { path: "{{ srv_apps_root }}/observability/prometheus", mode: "0755" }
      - { path: "{{ srv_apps_root }}/observability/grafana/provisioning/datasources", mode: "0755" }
      - { path: "{{ srv_apps_root }}/observability/grafana/provisioning/dashboards", mode: "0755" }
    staged_secret_files:
      - source_file: "{{ lookup('ansible.builtin.env', 'OBSERVABILITY_RUNTIME_ENV_SOURCE_FILE') | default('', true) }}"
        dest: "{{ srv_secrets_root }}/runtime/observability.env"
        mode: "0600"
    required_files:
      - "{{ srv_secrets_root }}/runtime/observability.env"
    config_files:
      - src: "{{ playbook_dir }}/../../compose/configs/loki/config.yml"
        dest: "{{ srv_apps_root }}/observability/loki/config.yml"
      - src: "{{ playbook_dir }}/../../compose/configs/prometheus/prometheus.yml"
        dest: "{{ srv_apps_root }}/observability/prometheus/prometheus.yml"
