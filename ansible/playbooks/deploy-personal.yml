---
- name: Deploy personal stack
  hosts: all
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load inventory group vars fragments
      ansible.builtin.include_vars:
        dir: "{{ inventory_dir }}/group_vars"
        extensions:
          - yml

  vars:
    deploy_stack: "{{ deploy.personal }}"

  roles:
    - role: deploy/shared
    - role: deploy/personal
