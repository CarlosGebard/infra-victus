---
- name: Copy personal stack compose file
  ansible.builtin.copy:
    src: "{{ deploy_stack.compose_src }}"
    dest: "{{ deploy_stack.compose_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Link active environment file into the personal stack directory
  ansible.builtin.file:
    src: "{{ deploy_stack.env_path }}"
    dest: "{{ deploy_stack.project_dir }}/.env"
    state: link

- name: Validate rendered personal Compose configuration
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} -f {{ deploy_stack.compose_path }} config
  changed_when: false

- name: Deploy the personal stack
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} -f {{ deploy_stack.compose_path }} up -d
  register: deploy_personal_up
  changed_when: >-
    'Started' in deploy_personal_up.stdout or
    'Recreated' in deploy_personal_up.stdout or
    'Creating' in deploy_personal_up.stdout
