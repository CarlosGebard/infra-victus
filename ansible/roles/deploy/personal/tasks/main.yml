---
- name: Copy personal stack compose file
  ansible.builtin.copy:
    src: "{{ deploy_stack.compose_src }}"
    dest: "{{ deploy_stack.compose_path }}"
    owner: root
    group: root
    mode: "0644"
  register: deploy_personal_compose_copy

- name: Link active environment file into the personal stack directory
  ansible.builtin.file:
    src: "{{ deploy_stack.env_path }}"
    dest: "{{ deploy_stack.project_dir }}/.env"
    state: link
  register: deploy_personal_env_link

- name: Derive personal runtime actions
  ansible.builtin.set_fact:
    deploy_personal_recreate_services: >-
      {{
        (
          deploy_recreate_services | default([])
          + (
            deploy_stack.compose_services | default([])
            if deploy_personal_compose_copy.changed or deploy_personal_env_link.changed
            else []
          )
        ) | unique
      }}

- name: Derive personal config-only restarts
  ansible.builtin.set_fact:
    deploy_personal_restart_services: >-
      {{
        (
          deploy_restart_services | default([])
        ) | difference(deploy_personal_recreate_services | default([]))
      }}

- name: Validate rendered personal Compose configuration
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} -f {{ deploy_stack.compose_path }} config
  changed_when: false

- name: Deploy the personal stack
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} -f {{ deploy_stack.compose_path }} up -d
  register: deploy_personal_up
  changed_when: >-
    'Started' in deploy_personal_up.stdout or
    'Recreated' in deploy_personal_up.stdout or
    'Creating' in deploy_personal_up.stdout

- name: Force recreate personal services with runtime definition changes
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ deploy_stack.env_path }}
      -f {{ deploy_stack.compose_path }}
      up -d --force-recreate {{ deploy_personal_recreate_services | join(' ') }}
  when: deploy_personal_recreate_services | length > 0
  register: deploy_personal_force_recreate
  changed_when: >-
    'Started' in deploy_personal_force_recreate.stdout or
    'Recreated' in deploy_personal_force_recreate.stdout or
    'Creating' in deploy_personal_force_recreate.stdout

- name: Restart personal services with config-only changes
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ deploy_stack.env_path }}
      -f {{ deploy_stack.compose_path }}
      restart {{ deploy_personal_restart_services | join(' ') }}
  when: deploy_personal_restart_services | length > 0
  register: deploy_personal_restart
  changed_when: deploy_personal_restart_services | length > 0
