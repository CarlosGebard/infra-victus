---
- name: Derive observability compose CLI args
  ansible.builtin.set_fact:
    deploy_observability_compose_args: >-
      {{
        deploy_stack.compose_cli_files
        | map('regex_replace', '^(.*)$', '-f \\1')
        | join(' ')
      }}

- name: Ensure observability deploy directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ deploy_stack.directories | default([]) }}"

- name: Stage observability runtime secret files
  ansible.builtin.copy:
    src: "{{ item.source_file }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0600') }}"
  loop: "{{ deploy_stack.staged_secret_files | default([]) }}"
  when: item.source_file | default('') | length > 0
  register: deploy_observability_secret_copy

- name: Assert required observability runtime files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ deploy_stack.required_files | default([]) }}"
  register: deploy_observability_required_files

- name: Stop observability deploy when required files missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Missing required observability file: {{ item.item }}"
  loop: "{{ deploy_observability_required_files.results }}"

- name: Copy observability static config files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0644') }}"
  loop: "{{ deploy_stack.config_files | default([]) }}"
  register: deploy_observability_config_copy

- name: Copy observability stack compose files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ deploy_stack.compose_files }}"
  register: deploy_observability_compose_copy

- name: Link active environment file into the observability stack directory
  ansible.builtin.file:
    src: "{{ deploy_stack.env_path }}"
    dest: "{{ deploy_stack.project_dir }}/.env"
    state: link
  register: deploy_observability_env_link

- name: Derive observability runtime actions
  ansible.builtin.set_fact:
    deploy_observability_recreate_services: >-
      {{
        (
          (
            deploy_observability_secret_copy.results | default([])
            | selectattr('changed')
            | map(attribute='item.recreate_services')
            | select('defined')
            | list
            | flatten
          )
          + (
            deploy_stack.compose_services | default([])
            if (
              deploy_observability_compose_copy.results | default([])
              | selectattr('changed')
              | list
              | length
            ) > 0 or deploy_observability_env_link.changed
            else []
          )
        ) | unique
      }}

- name: Derive observability config-only restarts
  ansible.builtin.set_fact:
    deploy_observability_restart_services: >-
      {{
        (
          deploy_observability_config_copy.results | default([])
          | selectattr('changed')
          | map(attribute='item.restart_services')
          | select('defined')
          | list
          | flatten
        ) | difference(deploy_observability_recreate_services | default([]))
      }}

- name: Validate rendered observability Compose configuration
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} {{ deploy_observability_compose_args }} config
  changed_when: false

- name: Deploy the observability stack
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} {{ deploy_observability_compose_args }} up -d
  register: deploy_observability_up
  changed_when: >-
    'Started' in deploy_observability_up.stdout or
    'Recreated' in deploy_observability_up.stdout or
    'Creating' in deploy_observability_up.stdout

- name: Force recreate observability services with runtime definition changes
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ deploy_stack.env_path }}
      {{ deploy_observability_compose_args }}
      up -d --force-recreate {{ deploy_observability_recreate_services | join(' ') }}
  when: deploy_observability_recreate_services | length > 0
  register: deploy_observability_force_recreate
  changed_when: >-
    'Started' in deploy_observability_force_recreate.stdout or
    'Recreated' in deploy_observability_force_recreate.stdout or
    'Creating' in deploy_observability_force_recreate.stdout

- name: Restart observability services with config-only changes
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ deploy_stack.env_path }}
      {{ deploy_observability_compose_args }}
      restart {{ deploy_observability_restart_services | join(' ') }}
  when: deploy_observability_restart_services | length > 0
  register: deploy_observability_restart
  changed_when: deploy_observability_restart_services | length > 0
