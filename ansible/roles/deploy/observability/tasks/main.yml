---
- name: Copy observability stack compose file
  ansible.builtin.copy:
    src: "{{ deploy_stack.compose_src }}"
    dest: "{{ deploy_stack.compose_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Link active environment file into the observability stack directory
  ansible.builtin.file:
    src: "{{ deploy_stack.env_path }}"
    dest: "{{ deploy_stack.project_dir }}/.env"
    state: link

- name: Validate rendered observability Compose configuration
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} -f {{ deploy_stack.compose_path }} config
  changed_when: false

- name: Deploy the observability stack
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} -f {{ deploy_stack.compose_path }} up -d
  register: deploy_observability_up
  changed_when: >-
    'Started' in deploy_observability_up.stdout or
    'Recreated' in deploy_observability_up.stdout or
    'Creating' in deploy_observability_up.stdout
