---
- name: Derive wiki compose CLI args
  ansible.builtin.set_fact:
    deploy_wiki_compose_args: >-
      {{
        '-f ' ~ (deploy_stack.compose_cli_files | join(' -f '))
      }}

- name: Ensure wiki deploy directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop: "{{ deploy_stack.directories | default([]) }}"

- name: Stage wiki runtime secret files
  ansible.builtin.copy:
    src: "{{ item.source_file }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode | default('0600') }}"
  loop: "{{ deploy_stack.staged_secret_files | default([]) }}"
  when: item.source_file | default('') | length > 0
  register: deploy_wiki_secret_copy

- name: Assert required wiki runtime files exist
  ansible.builtin.stat:
    path: "{{ item }}"
  loop: "{{ deploy_stack.required_files | default([]) }}"
  register: deploy_wiki_required_files

- name: Stop wiki deploy when required files missing
  ansible.builtin.assert:
    that:
      - item.stat.exists
    fail_msg: "Missing required wiki file: {{ item.item }}"
  loop: "{{ deploy_wiki_required_files.results }}"

- name: Read wiki runtime env
  ansible.builtin.slurp:
    path: "{{ deploy_stack.env_path }}"
  register: deploy_wiki_runtime_env_raw

- name: Validate wiki database runtime env
  ansible.builtin.assert:
    that:
      - deploy_wiki_db_password is not none
      - deploy_wiki_db_password | length >= 16
      - deploy_wiki_db_password != 'change-me'
    fail_msg: >-
      Wiki runtime env at {{ deploy_stack.env_path }} must define
      WIKIJS_DB_PASSWORD with at least 16 characters and not use local defaults.
  vars:
    deploy_wiki_runtime_env_text: "{{ deploy_wiki_runtime_env_raw.content | b64decode }}"
    deploy_wiki_db_password: "{{ deploy_wiki_runtime_env_text | regex_findall('(?m)^WIKIJS_DB_PASSWORD=(.+)$') | first | default(none) }}"

- name: Copy wiki stack compose files
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ deploy_stack.compose_files }}"
  register: deploy_wiki_compose_copy

- name: Link active environment file into the wiki stack directory
  ansible.builtin.file:
    src: "{{ deploy_stack.env_path }}"
    dest: "{{ deploy_stack.project_dir }}/.env"
    state: link
  register: deploy_wiki_env_link

- name: Derive wiki runtime actions
  ansible.builtin.set_fact:
    deploy_wiki_recreate_services: >-
      {{
        (
          (
            deploy_wiki_secret_copy.results | default([])
            | selectattr('changed')
            | map(attribute='item.recreate_services')
            | select('defined')
            | list
            | flatten
          )
          + (
            deploy_stack.compose_services | default([])
            if (
              deploy_wiki_compose_copy.results | default([])
              | selectattr('changed')
              | list
              | length
            ) > 0 or deploy_wiki_env_link.changed
            else []
          )
        ) | unique
      }}

- name: Validate rendered wiki Compose configuration
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} {{ deploy_wiki_compose_args }} config
  changed_when: false

- name: Deploy the wiki stack
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} {{ deploy_wiki_compose_args }} up -d
  register: deploy_wiki_up
  changed_when: >-
    'Started' in deploy_wiki_up.stdout or
    'Recreated' in deploy_wiki_up.stdout or
    'Creating' in deploy_wiki_up.stdout

- name: Force recreate wiki services with runtime definition changes
  ansible.builtin.command:
    cmd: >-
      docker compose --env-file {{ deploy_stack.env_path }}
      {{ deploy_wiki_compose_args }}
      up -d --force-recreate {{ deploy_wiki_recreate_services | join(' ') }}
  when: deploy_wiki_recreate_services | length > 0
  register: deploy_wiki_force_recreate
  changed_when: >-
    'Started' in deploy_wiki_force_recreate.stdout or
    'Recreated' in deploy_wiki_force_recreate.stdout or
    'Creating' in deploy_wiki_force_recreate.stdout
