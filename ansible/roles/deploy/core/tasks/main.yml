---
- name: Derive core domain variables
  ansible.builtin.set_fact:
    core_base_domain: "{{ lookup('ansible.builtin.env', 'BASE_DOMAIN') | default('', true) }}"
    core_certbot_email: >-
      {{
        lookup('ansible.builtin.env', 'CERTBOT_EMAIL')
        | default(host.admin_user ~ '@' ~ (lookup('ansible.builtin.env', 'BASE_DOMAIN') | default('', true)), true)
      }}
    core_public_domains:
      - "seaweed.{{ lookup('ansible.builtin.env', 'BASE_DOMAIN') | default('', true) }}"
      - "filer.{{ lookup('ansible.builtin.env', 'BASE_DOMAIN') | default('', true) }}"
      - "s3.{{ lookup('ansible.builtin.env', 'BASE_DOMAIN') | default('', true) }}"
      - "couchdb.{{ lookup('ansible.builtin.env', 'BASE_DOMAIN') | default('', true) }}"
    core_cert_name: "core-edge-{{ (lookup('ansible.builtin.env', 'BASE_DOMAIN') | default('', true)) | replace('.', '-') }}"

- name: Validate required core domain variables
  ansible.builtin.assert:
    that:
      - core_base_domain | length > 0
    fail_msg: "BASE_DOMAIN environment variable is required for core deploy."

- name: Install certbot packages for core TLS
  ansible.builtin.apt:
    name:
      - certbot
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Allow HTTP and HTTPS through UFW
  ansible.builtin.command: "ufw allow {{ item }}/tcp"
  loop:
    - 80
    - 443
  register: deploy_core_ufw_allow_rule
  changed_when: >-
    'Rule added' in deploy_core_ufw_allow_rule.stdout or
    'Rules updated' in deploy_core_ufw_allow_rule.stdout

- name: Check whether core TLS certificate already exists
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ core_cert_name }}/fullchain.pem"
  register: core_tls_cert

- name: Copy core stack compose file
  ansible.builtin.copy:
    src: "{{ deploy_stack.compose_src }}"
    dest: "{{ deploy_stack.compose_path }}"
    owner: root
    group: root
    mode: "0644"

- name: Render core nginx routing
  ansible.builtin.template:
    src: nginx-core.conf.j2
    dest: "{{ deploy_stack.project_dir }}/nginx/conf.d/core.conf"
    owner: root
    group: root
    mode: "0644"
  vars:
    seaweed_domain: "{{ core_public_domains[0] }}"
    filer_domain: "{{ core_public_domains[1] }}"
    s3_domain: "{{ core_public_domains[2] }}"
    couchdb_domain: "{{ core_public_domains[3] }}"
    core_cert_name: "{{ core_cert_name }}"
    core_tls_enabled: "{{ core_tls_cert.stat.exists }}"

- name: Link active environment file into the core stack directory
  ansible.builtin.file:
    src: "{{ deploy_stack.env_path }}"
    dest: "{{ deploy_stack.project_dir }}/.env"
    state: link

- name: Validate rendered core Compose configuration
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} -f {{ deploy_stack.compose_path }} config
  changed_when: false

- name: Deploy the core stack
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} -f {{ deploy_stack.compose_path }} up -d
  register: deploy_core_up
  changed_when: >-
    'Started' in deploy_core_up.stdout or
    'Recreated' in deploy_core_up.stdout or
    'Creating' in deploy_core_up.stdout

- name: Obtain or renew core TLS certificate
  ansible.builtin.command:
    cmd: >-
      certbot certonly --non-interactive --agree-tos
      --email {{ core_certbot_email }}
      --cert-name {{ core_cert_name }}
      {% if core_tls_cert.stat.exists %}--expand{% else %}--duplicate{% endif %}
      --webroot -w {{ deploy_stack.project_dir }}/nginx/acme
      {% for domain in core_public_domains %}-d {{ domain }} {% endfor %}
      --keep-until-expiring
  register: core_certbot_result
  changed_when: >-
    'Successfully received certificate' in core_certbot_result.stdout or
    'Congratulations' in core_certbot_result.stdout or
    'Certificate not yet due for renewal' not in core_certbot_result.stdout

- name: Re-check core TLS certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ core_cert_name }}/fullchain.pem"
  register: core_tls_cert_after

- name: Ensure core TLS certificate exists
  ansible.builtin.assert:
    that:
      - core_tls_cert_after.stat.exists
    fail_msg: "Core TLS certificate was not created by certbot."

- name: Render core nginx routing with TLS enabled
  ansible.builtin.template:
    src: nginx-core.conf.j2
    dest: "{{ deploy_stack.project_dir }}/nginx/conf.d/core.conf"
    owner: root
    group: root
    mode: "0644"
  vars:
    seaweed_domain: "{{ core_public_domains[0] }}"
    filer_domain: "{{ core_public_domains[1] }}"
    s3_domain: "{{ core_public_domains[2] }}"
    couchdb_domain: "{{ core_public_domains[3] }}"
    core_cert_name: "{{ core_cert_name }}"
    core_tls_enabled: true

- name: Redeploy the core stack with TLS enabled
  ansible.builtin.command:
    cmd: docker compose --env-file {{ deploy_stack.env_path }} -f {{ deploy_stack.compose_path }} up -d
  register: deploy_core_tls_up
  changed_when: >-
    'Started' in deploy_core_tls_up.stdout or
    'Recreated' in deploy_core_tls_up.stdout or
    'Creating' in deploy_core_tls_up.stdout
