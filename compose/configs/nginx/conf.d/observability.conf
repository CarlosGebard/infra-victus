upstream grafana_upstream {
  zone grafana_zone 64k;
  server grafana:3000 resolve;
}

upstream prometheus_upstream {
  zone prometheus_zone 64k;
  server prometheus:9090 resolve;
}

upstream loki_upstream {
  zone loki_zone 64k;
  server loki:3100 resolve;
}

resolver 127.0.0.11:53 valid=10s;
resolver_timeout 5s;
