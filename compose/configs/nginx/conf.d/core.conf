upstream couchdb_upstream {
  zone couchdb_zone 64k;
  server couchdb:5984 resolve;
}

upstream seaweedfs_master_upstream {
  zone seaweedfs_master_zone 64k;
  server seaweedfs:9333 resolve;
}

upstream seaweedfs_filer_upstream {
  zone seaweedfs_filer_zone 64k;
  server seaweedfs:8888 resolve;
}

upstream seaweedfs_s3_upstream {
  zone seaweedfs_s3_zone 64k;
  server seaweedfs:8333 resolve;
}

resolver 127.0.0.11:53 valid=10s;
resolver_timeout 5s;

server {
  listen 80 default_server;
  server_name _;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    default_type text/plain;
    return 200 "infra-macro-vps core gateway\n";
  }

  location /couchdb/ {
    proxy_pass http://couchdb_upstream/;
  }

  location /seaweed/master/ {
    proxy_pass http://seaweedfs_master_upstream/;
  }

  location /seaweed/filer/ {
    proxy_pass http://seaweedfs_filer_upstream/;
  }

  location /seaweed/s3/ {
    proxy_pass http://seaweedfs_s3_upstream/;
  }

  location /grafana/ {
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /grafana;
    proxy_pass http://grafana_upstream/;
  }

  location /prometheus/ {
    proxy_pass http://prometheus_upstream/;
  }

  location /loki/ {
    proxy_pass http://loki_upstream/;
  }
}
