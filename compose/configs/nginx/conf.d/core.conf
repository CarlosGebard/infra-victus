server {
  listen 80 default_server;
  server_name _;
  
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    return 404;
  }

  location /couchdb/ {
    set $upstream couchdb:5984;
    proxy_pass http://$upstream/;
  }

  location /seaweed/master/ {
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;
    set $upstream seaweedfs:9333;
    proxy_pass http://$upstream/;
  }

  location /seaweed/filer/ {
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;
    set $upstream seaweedfs:8888;
    proxy_pass http://$upstream/;
  }

  location /grafana/ {
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /grafana;
    set $upstream grafana:3000;
    proxy_pass http://$upstream/;
  }

  location /prometheus/ {
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;
    set $upstream prometheus:9090;
    proxy_pass http://$upstream/;
  }

  location /loki/ {
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;
    set $upstream loki:3100;
    proxy_pass http://$upstream/;
  }
}

server {
  listen 80;
  server_name s3.carlosjg.space;

  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  location / {
    allow 127.0.0.1;
    allow 100.64.0.0/10;
    allow fd7a:115c:a1e0::/48;
    deny all;
    proxy_set_header Host $host;
    set $upstream seaweedfs:8333;
    proxy_pass http://$upstream;
  }
}
