server {
  listen 80 default_server;
  server_name _;
  
  resolver 127.0.0.11:53 valid=10s;
  resolver_timeout 5s;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location = / {
    default_type text/plain;
    return 200 "infra-macro-vps core gateway\n";
  }

  location /couchdb/ {
    proxy_pass http://couchdb:5984/;
  }

  location /seaweed/master/ {
    proxy_pass http://seaweedfs:9333/;
  }

  location /seaweed/filer/ {
    proxy_pass http://seaweedfs:8888/;
  }

  location /seaweed/s3/ {
    proxy_pass http://seaweedfs:8333/;
  }

  location /grafana/ {
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /grafana;
    proxy_pass http://grafana:3000/;
  }

  location /prometheus/ {
    proxy_pass http://prometheus:9090/;
  }

  location /loki/ {
    proxy_pass http://loki:3100/;
  }
}
