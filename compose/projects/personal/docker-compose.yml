services:
  couchdb:
    image: couchdb:3.5.1
    container_name: couchdb
    user: "5984:5984"
    restart: unless-stopped
    environment:
      COUCHDB_USER: ${COUCHDB_USER:-admin}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    volumes:
      - /srv/data/couchdb/data:/opt/couchdb/data
      - /srv/apps/personal/couchdb/local.d/local.ini:/opt/couchdb/etc/local.d/local.ini:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://${COUCHDB_USER:-admin}:${COUCHDB_PASSWORD}@127.0.0.1:5984/_up >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - personal_backend
      - shared_backend

networks:
  personal_backend:
    driver: bridge
  shared_backend:
    name: infra_shared_backend
    external: true
