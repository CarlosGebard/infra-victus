services:
  loki:
    image: grafana/loki:3.6.3
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-verify-config=true", "-config.file=/etc/loki/config.yml"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - observability_backend
      - shared_backend

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - observability_backend
      - shared_backend

networks:
  observability_backend:
    driver: bridge
  shared_backend:
    name: infra_shared_backend
    external: true
