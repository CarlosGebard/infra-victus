services:
  loki:
    image: grafana/loki:3.6.3
    container_name: loki
    restart: unless-stopped
    command:
      - -config.file=/etc/loki/config.yml
    ports:
      - "${LOKI_BIND_IP:-127.0.0.1}:${LOKI_HTTP_PORT:-3100}:3100"
    volumes:
      - ../../configs/loki/config.yml:/etc/loki/config.yml:ro
      - ../../.tmp/observability/loki:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - observability_backend
      - shared_backend

  prometheus:
    image: prom/prometheus:v3.9.1
    container_name: prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_BIND_IP:-127.0.0.1}:${PROMETHEUS_HTTP_PORT:-9090}:9090"
    volumes:
      - ../../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../../.tmp/observability/prometheus:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      loki:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - observability_backend
      - shared_backend

  grafana:
    image: grafana/grafana:12.4
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://127.0.0.1:8080/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:${GRAFANA_HTTP_PORT:-3000}:3000"
    volumes:
      - ../../.tmp/observability/grafana:/var/lib/grafana
      - ../../configs/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      loki:
        condition: service_started
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - observability_backend
      - shared_backend

networks:
  observability_backend:
    driver: bridge
  shared_backend:
    name: infra_shared_backend
    driver: bridge
