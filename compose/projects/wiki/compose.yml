services:
  wiki:
    image: ghcr.io/requarks/wiki:2
    container_name: wiki
    restart: unless-stopped
    environment:
      DB_TYPE: postgres
      DB_HOST: wiki-database
      DB_PORT: 5432
      DB_USER: ${WIKIJS_DB_USER:-wikijs}
      DB_PASS: ${WIKIJS_DB_PASSWORD}
      DB_NAME: ${WIKIJS_DB_NAME:-victus_documentation}
    depends_on:
      wiki-database:
        condition: service_healthy
    networks:
      - wiki_backend
      - shared_backend

  wiki-database:
    image: postgres:15-alpine
    container_name: wiki-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${WIKIJS_DB_NAME:-victus_documentation}
      POSTGRES_USER: ${WIKIJS_DB_USER:-wikijs}
      POSTGRES_PASSWORD: ${WIKIJS_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - wiki_backend

networks:
  wiki_backend:
    driver: bridge
  shared_backend:
    name: infra_shared_backend
    external: true
