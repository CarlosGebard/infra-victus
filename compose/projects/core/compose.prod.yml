services:
  nginx-private:
    ports:
      - "${NGINX_BIND_IP:-127.0.0.1}:${NGINX_HTTP_PORT:-80}:80"
    volumes:
      - /srv/apps/core/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/apps/core/nginx/private/conf.d:/etc/nginx/conf.d:ro
      - /srv/apps/core/nginx/snippets:/etc/nginx/snippets:ro
      - /srv/logs/nginx-private:/var/log/nginx

  nginx-public:
    ports:
      - "${NGINX_PUBLIC_BIND_IP:-0.0.0.0}:${NGINX_PUBLIC_HTTP_PORT:-80}:80"
      - "${NGINX_PUBLIC_BIND_IP:-0.0.0.0}:${NGINX_PUBLIC_HTTPS_PORT:-443}:443"
    volumes:
      - /srv/apps/core/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/apps/core/nginx/public/conf.d:/etc/nginx/conf.d:ro
      - /srv/apps/core/nginx/snippets:/etc/nginx/snippets:ro
      - /srv/apps/core/nginx/acme:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /srv/logs/nginx-public:/var/log/nginx

  seaweedfs:
    volumes:
      - /srv/data/seaweed/data:/data
      - /srv/secrets/runtime/seaweed-s3.json:/run/secrets/seaweed-s3.json:ro

  etcd:
    volumes:
      - /srv/data/etcd/core-dns:/etcd-data

  coredns:
    ports:
      - "${COREDNS_BIND_IP:-127.0.0.1}:${COREDNS_DNS_PORT:-53}:53/tcp"
      - "${COREDNS_BIND_IP:-127.0.0.1}:${COREDNS_DNS_PORT:-53}:53/udp"
    volumes:
      - /srv/apps/core/coredns/Corefile:/etc/coredns/Corefile:ro

  pipeline-postgres:
    ports:
      - "${POSTGRES_BIND_IP:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - /srv/data/pipeline/postgres:/var/lib/postgresql/data

  redis:
    ports:
      - "${REDIS_BIND_IP:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - /srv/data/redis:/data
