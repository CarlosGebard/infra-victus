services:
  nginx:
    ports:
      - "${NGINX_BIND_IP:-0.0.0.0}:${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_BIND_IP:-0.0.0.0}:${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - /srv/apps/core/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /srv/apps/core/nginx/conf.d:/etc/nginx/conf.d:ro
      - /srv/apps/core/nginx/snippets:/etc/nginx/snippets:ro
      - /srv/apps/core/nginx/acme:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /srv/logs/nginx:/var/log/nginx

  seaweedfs:
    volumes:
      - /srv/data/seaweed/data:/data
      - /srv/secrets/runtime/seaweed-s3.json:/run/secrets/seaweed-s3.json:ro
