services:
  nginx:
    image: nginx:1.28.3-alpine
    container_name: nginx
    restart: unless-stopped
    depends_on:
      seaweedfs:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - edge
      - core_backend
      - shared_backend

  seaweedfs:
    image: chrislusf/seaweedfs:4.05
    container_name: seaweedfs
    restart: unless-stopped
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.config=/run/secrets/seaweed-s3.json
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - core_backend

  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: etcd
    restart: unless-stopped
    command:
      - /usr/local/bin/etcd
      - --name=core-etcd
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=core-etcd=http://etcd:2380
      - --initial-cluster-state=new
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - core_backend

  coredns:
    image: coredns/coredns:1.14.2
    container_name: coredns
    restart: unless-stopped
    environment:
      DNS_TARGET_IP: ${TAILSCALE_IPV4:-127.0.0.1}
    depends_on:
      etcd:
        condition: service_healthy
    command:
      - -conf
      - /etc/coredns/Corefile
    networks:
      - core_backend

networks:
  edge:
    driver: bridge
  core_backend:
    driver: bridge
  shared_backend:
    name: infra_shared_backend
    external: true
