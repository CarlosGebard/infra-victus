services:
  nginx:
    ports:
      - "${NGINX_BIND_IP:-127.0.0.1}:${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ../../configs/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../../configs/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../../configs/nginx/snippets:/etc/nginx/snippets:ro
      - ../../.tmp/core/nginx/logs:/var/log/nginx

  seaweedfs:
    volumes:
      - ../../.tmp/core/seaweedfs/data:/data
      - ../../configs/seaweedfs/s3.json.example:/run/secrets/seaweed-s3.json:ro
