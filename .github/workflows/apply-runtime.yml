name: Apply Runtime

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to apply
        required: true
        default: main
      check_mode:
        description: Run Ansible in check mode only
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: production-runtime
  cancel-in-progress: false

jobs:
  runtime:
    name: Apply production runtime baseline from Infisical secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull runtime secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "0a100e5d-1422-437e-b447-e032f32403fa"
          project-slug: "victus-main-server-qy-2z"
          env-slug: "prod"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Validate runtime playbook syntax
        run: tests/ansible/runtime-syntax-check.sh

      - name: Assert required runtime secrets are present
        env:
          BOOTSTRAP_HOST: ${{ env.BOOTSTRAP_HOST }}
          BOOTSTRAP_SSH_PRIVATE_KEY: ${{ env.BOOTSTRAP_SSH_PRIVATE_KEY }}
          BOOTSTRAP_SSH_USER: ${{ env.BOOTSTRAP_SSH_USER }}
        run: |
          set -euo pipefail

          [[ -n "${BOOTSTRAP_HOST}" ]] || { echo "Missing BOOTSTRAP_HOST"; exit 1; }
          [[ -n "${BOOTSTRAP_SSH_USER}" ]] || { echo "Missing BOOTSTRAP_SSH_USER"; exit 1; }
          [[ -n "${BOOTSTRAP_SSH_PRIVATE_KEY}" ]] || { echo "Missing BOOTSTRAP_SSH_PRIVATE_KEY"; exit 1; }

      - name: Prepare SSH material
        env:
          BOOTSTRAP_HOST: ${{ env.BOOTSTRAP_HOST }}
          BOOTSTRAP_KNOWN_HOSTS: ${{ env.BOOTSTRAP_KNOWN_HOSTS }}
          BOOTSTRAP_SSH_PORT: ${{ env.BOOTSTRAP_SSH_PORT }}
          BOOTSTRAP_SSH_PRIVATE_KEY: ${{ env.BOOTSTRAP_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$BOOTSTRAP_SSH_PRIVATE_KEY" > "$HOME/.ssh/runtime_key"
          chmod 600 "$HOME/.ssh/runtime_key"

          if [[ -n "${BOOTSTRAP_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$BOOTSTRAP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${BOOTSTRAP_SSH_PORT:-22}" -H "$BOOTSTRAP_HOST" >> "$HOME/.ssh/known_hosts"
          fi

          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Build temporary inventory
        env:
          BOOTSTRAP_HOST: ${{ env.BOOTSTRAP_HOST }}
          BOOTSTRAP_SSH_PORT: ${{ env.BOOTSTRAP_SSH_PORT }}
          BOOTSTRAP_SSH_USER: ${{ env.BOOTSTRAP_SSH_USER }}
        run: |
          set -euo pipefail

          cat > /tmp/runtime-hosts.yml <<EOF
          all:
            hosts:
              runtime_target:
                ansible_host: ${BOOTSTRAP_HOST}
                ansible_user: ${BOOTSTRAP_SSH_USER}
                ansible_port: ${BOOTSTRAP_SSH_PORT:-22}
                ansible_ssh_private_key_file: ${HOME}/.ssh/runtime_key
          EOF

      - name: Run runtime playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
        run: |
          set -euo pipefail

          cd ansible

          ansible-playbook \
            -i /tmp/runtime-hosts.yml \
            playbooks/runtime.yml \
            $([[ "${{ inputs.check_mode }}" == "true" ]] && printf '%s' --check)
