name: Deploy LLM Fast Track

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: true
        default: main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-llm.yml"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "ansible/**"
      - "compose/projects/llm/**"
      - "compose/configs/litellm/**"
      - "compose/configs/llm-postgres/**"

concurrency:
  group: production-deploy-llm
  cancel-in-progress: false

env:
  DEPLOY_GIT_REF: ${{ inputs.git_ref || github.sha }}

jobs:
  deploy-llm:
    name: Deploy llm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"
          secret-path: "${{ vars.INFISICAL_SECRET_PATH }}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.PROD_HOST }}
        env:
          TAILSCALE_TAILNET: ${{ secrets.TAILSCALE_TAILNET }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Prepare deploy context
        uses: ./.github/actions/prepare-deploy-context
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}

      - name: Materialize llm runtime env
        env:
          LLM_POSTGRES_PASSWORD: ${{ env.LLM_POSTGRES_PASSWORD }}
          LITELLM_DB_PASSWORD: ${{ env.LITELLM_DB_PASSWORD }}
          LITELLM_MASTER_KEY: ${{ env.LITELLM_MASTER_KEY }}
          LITELLM_SALT_KEY: ${{ env.LITELLM_SALT_KEY }}
          LITELLM_UI_PASSWORD: ${{ env.LITELLM_UI_PASSWORD }}
          LANGFUSE_DB_PASSWORD: ${{ env.LANGFUSE_DB_PASSWORD }}
          LANGFUSE_NEXTAUTH_SECRET: ${{ env.LANGFUSE_NEXTAUTH_SECRET }}
          LANGFUSE_SALT: ${{ env.LANGFUSE_SALT }}
          LANGFUSE_ENCRYPTION_KEY: ${{ env.LANGFUSE_ENCRYPTION_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ env.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ env.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail

          printf '%s\n' \
            'LLM_POSTGRES_DB=postgres' \
            'LLM_POSTGRES_USER=llm_admin' \
            "LLM_POSTGRES_PASSWORD=${LLM_POSTGRES_PASSWORD}" \
            'LITELLM_DB=litellm' \
            'LITELLM_DB_USER=litellm' \
            "LITELLM_DB_PASSWORD=${LITELLM_DB_PASSWORD}" \
            "LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}" \
            "LITELLM_SALT_KEY=${LITELLM_SALT_KEY}" \
            'LITELLM_UI_USERNAME=admin' \
            "LITELLM_UI_PASSWORD=${LITELLM_UI_PASSWORD}" \
            'LITELLM_WORKERS=2' \
            'LANGFUSE_DB=langfuse' \
            'LANGFUSE_DB_USER=langfuse' \
            "LANGFUSE_DB_PASSWORD=${LANGFUSE_DB_PASSWORD}" \
            'LANGFUSE_NEXTAUTH_URL=http://langfuse.victus.io' \
            "LANGFUSE_NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}" \
            "LANGFUSE_SALT=${LANGFUSE_SALT}" \
            "LANGFUSE_ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}" \
            'LANGFUSE_TELEMETRY_ENABLED=false' \
            'LANGFUSE_HOST=http://langfuse:3000' \
            "LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}" \
            "LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}" \
            > /tmp/llm-runtime.env
          chmod 600 /tmp/llm-runtime.env

      - name: Ensure shared Docker network exists
        env:
          SSH_PORT: ${{ env.PROD_SSH_PORT || 22 }}
          DEPLOY_SSH_USER: ${{ env.DEPLOY_SSH_USER || 'carlos' }}
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" "$DEPLOY_SSH_USER@$PROD_HOST" \
            'docker network inspect infra_shared_backend >/dev/null 2>&1 || docker network create infra_shared_backend'

      - name: Deploy llm
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
          LLM_RUNTIME_ENV_SOURCE_FILE: /tmp/llm-runtime.env
        run: |
          set -euo pipefail
          cd ansible
          ansible-playbook -i /tmp/deploy-hosts.yml playbooks/deploy-llm.yml
