name: Publish TechDocs

on:
  workflow_call:
    inputs:
      entity:
        description: Backstage entity reference that owns the generated site.
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Generate and publish
    runs-on: [self-hosted, linux, x64, victus-techdocs]
    timeout-minutes: 15

    steps:
      - name: Check out documentation source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Load publication credentials from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: oidc
          identity-id: ${{ vars.INFISICAL_TECHDOCS_PUBLISHER_ID }}
          project-slug: ${{ vars.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ vars.INFISICAL_ENV_SLUG }}
          secret-path: /Hetzner-Server/wiki

      - name: Generate and publish TechDocs
        env:
          AWS_ACCESS_KEY_ID: ${{ env.TECHDOCS_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ env.TECHDOCS_S3_SECRET_KEY }}
          AWS_REGION: us-east-1
        run: |
          set -euo pipefail
          npm install --global @techdocs/cli
          python -m pip install 'mkdocs-techdocs-core==1.*'
          techdocs-cli generate --no-docker --output-dir ./site
          techdocs-cli publish \
            --publisher-type awsS3 \
            --storage-name victus-techdocs \
            --directory ./site \
            --entity "${{ inputs.entity }}" \
            --awsEndpoint http://127.0.0.1:8333 \
            --awsS3ForcePathStyle
