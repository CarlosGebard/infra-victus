name: Deploy All Stacks

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: true
        default: main
      auto_rollback:
        description: Automatically rollback on failure
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "ansible/**"
      - "compose/**"
      - "tests/ansible/**"

concurrency:
  group: production-deploy-all
  cancel-in-progress: false

env:
  DEPLOY_GIT_REF: ${{ inputs.git_ref || github.sha }}

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Validate all playbooks
        run: |
          set -euo pipefail
          
          bash tests/ansible/deploy-syntax-check.sh
          bash tests/ansible/deploy-personal-syntax-check.sh
          bash tests/ansible/deploy-observability-syntax-check.sh
          bash tests/ansible/preflight-syntax-check.sh
          bash tests/ansible/review-syntax-check.sh

      - name: Validate all docker-compose files
        run: |
          set -euo pipefail

          docker compose -f compose/projects/core/compose.yml -f compose/projects/core/compose.prod.yml config > /dev/null
          docker compose -f compose/projects/personal/compose.yml -f compose/projects/personal/compose.prod.yml config > /dev/null
          docker compose -f compose/projects/observability/compose.yml -f compose/projects/observability/compose.prod.yml config > /dev/null

      - name: Assert all required secrets present
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
          COUCHDB_PASSWORD: ${{ env.COUCHDB_PASSWORD }}
          COUCHDB_USER: ${{ env.COUCHDB_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ env.GRAFANA_ADMIN_PASSWORD }}
          SEAWEED_S3_ACCESS_KEY: ${{ env.SEAWEED_S3_ACCESS_KEY }}
          SEAWEED_S3_SECRET_KEY: ${{ env.SEAWEED_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          
          errors=()
          
          # Global secrets
          [[ -n "${PROD_HOST}" ]] || errors+=("Missing PROD_HOST")
          [[ -n "${PROD_SSH_PRIVATE_KEY}" ]] || errors+=("Missing PROD_SSH_PRIVATE_KEY")
          
          # Core secrets
          [[ -n "${SEAWEED_S3_ACCESS_KEY}" ]] || errors+=("Missing SEAWEED_S3_ACCESS_KEY")
          [[ -n "${SEAWEED_S3_SECRET_KEY}" ]] || errors+=("Missing SEAWEED_S3_SECRET_KEY")
          
          # Personal secrets
          [[ -n "${COUCHDB_USER}" ]] || errors+=("Missing COUCHDB_USER")
          [[ -n "${COUCHDB_PASSWORD}" ]] || errors+=("Missing COUCHDB_PASSWORD")
          
          # Observability secrets
          [[ -n "${GRAFANA_ADMIN_PASSWORD}" ]] || errors+=("Missing GRAFANA_ADMIN_PASSWORD")
          
          if [[ ${#errors[@]} -gt 0 ]]; then
            printf '%s\n' "${errors[@]}" >&2
            exit 1
          fi

  preflight:
    name: Check Host Ready
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Prepare SSH material
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-ssh.sh

      - name: Build inventory
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          bash .github/scripts/build-deploy-inventory.sh

      - name: Check host deploy prerequisites
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
        run: |
          set -euo pipefail
          
          cd ansible
          
          ansible-playbook \
            -i /tmp/deploy-hosts.yml \
            playbooks/preflight.yml

  deploy-observability:
    name: Deploy Observability Stack
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Prepare SSH material
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-ssh.sh

      - name: Materialize observability runtime env
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ env.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          
          printf '%s\n' \
            'LOKI_BIND_IP=127.0.0.1' \
            'LOKI_HTTP_PORT=3100' \
            'PROMETHEUS_BIND_IP=127.0.0.1' \
            'PROMETHEUS_HTTP_PORT=9090' \
            'GRAFANA_ADMIN_USER=admin' \
            "GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}" \
            'GRAFANA_BIND_IP=127.0.0.1' \
            'GRAFANA_HTTP_PORT=3000' \
            'GRAFANA_ROOT_URL=http://127.0.0.1:8080/grafana/' \
            > /tmp/observability-runtime.env
          chmod 600 /tmp/observability-runtime.env

      - name: Build inventory
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          bash .github/scripts/build-deploy-inventory.sh

      - name: Validate observability deploy files exist
        run: |
          set -euo pipefail
          
          [[ -f /tmp/observability-runtime.env ]] || { echo "✗ Missing /tmp/observability-runtime.env"; exit 1; }
          [[ -f /tmp/deploy-hosts.yml ]] || { echo "✗ Missing /tmp/deploy-hosts.yml"; exit 1; }

      - name: Deploy observability
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
          OBSERVABILITY_RUNTIME_ENV_SOURCE_FILE: /tmp/observability-runtime.env
        run: |
          set -euo pipefail
          
          cd ansible
          
          ansible-playbook \
            -i /tmp/deploy-hosts.yml \
            playbooks/deploy-observability.yml

  deploy-personal:
    name: Deploy Personal Stack
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Prepare SSH material
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-ssh.sh

      - name: Materialize personal runtime env
        env:
          COUCHDB_USER: ${{ env.COUCHDB_USER }}
          COUCHDB_PASSWORD: ${{ env.COUCHDB_PASSWORD }}
        run: |
          set -euo pipefail
          
          printf '%s\n' \
            "COUCHDB_USER=${COUCHDB_USER}" \
            "COUCHDB_PASSWORD=${COUCHDB_PASSWORD}" \
            > /tmp/personal-runtime.env
          chmod 600 /tmp/personal-runtime.env

      - name: Build inventory
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          bash .github/scripts/build-deploy-inventory.sh

      - name: Validate personal deploy files exist
        run: |
          set -euo pipefail
          
          echo "Checking required files for personal deployment..."
          [[ -f /tmp/personal-runtime.env ]] || { echo "✗ Missing /tmp/personal-runtime.env"; exit 1; }
          [[ -f /tmp/deploy-hosts.yml ]] || { echo "✗ Missing /tmp/deploy-hosts.yml"; exit 1; }
          
          echo "✓ All files present"

      - name: Deploy personal
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
          PERSONAL_RUNTIME_ENV_SOURCE_FILE: /tmp/personal-runtime.env
        run: |
          set -euo pipefail
          
          cd ansible
          
          ansible-playbook \
            -i /tmp/deploy-hosts.yml \
            playbooks/deploy-personal.yml

  deploy-core:
    name: Deploy Core Stack
    needs: [deploy-observability, deploy-personal]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Prepare SSH material
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-ssh.sh

      - name: Materialize core runtime env
        env:
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}
          CORE_RUNTIME_ENV: ${{ vars.CORE_RUNTIME_ENV }}
          SEAWEED_S3_ACCESS_KEY: ${{ env.SEAWEED_S3_ACCESS_KEY }}
          SEAWEED_S3_SECRET_KEY: ${{ env.SEAWEED_S3_SECRET_KEY }}
        run: |
          set -euo pipefail
          
          if [[ -n "${CORE_RUNTIME_ENV:-}" ]]; then
            printf '%s\n' "$CORE_RUNTIME_ENV" > /tmp/core-runtime.env
          else
            printf '%s\n' \
              'NGINX_BIND_IP=0.0.0.0' \
              'NGINX_HTTP_PORT=80' \
              'NGINX_HTTPS_BIND_IP=0.0.0.0' \
              'NGINX_HTTPS_PORT=443' \
              > /tmp/core-runtime.env
          fi

          grep -q '^NGINX_HTTPS_BIND_IP=' /tmp/core-runtime.env || printf '%s\n' 'NGINX_HTTPS_BIND_IP=0.0.0.0' >> /tmp/core-runtime.env
          grep -q '^NGINX_HTTPS_PORT=' /tmp/core-runtime.env || printf '%s\n' 'NGINX_HTTPS_PORT=443' >> /tmp/core-runtime.env
          chmod 600 /tmp/core-runtime.env
          
          # Seaweed S3 credentials
          printf '%s\n' \
            '{' \
            '  "identities": [' \
            '    {' \
            '      "name": "main",' \
            '      "credentials": [' \
            '        {' \
            "          \"accessKey\": \"${SEAWEED_S3_ACCESS_KEY}\"," \
            "          \"secretKey\": \"${SEAWEED_S3_SECRET_KEY}\"" \
            '        }' \
            '      ],' \
            '      "actions": [' \
            '        "Admin",' \
            '        "Read",' \
            '        "Tagging",' \
            '        "Write",' \
            '        "List"' \
            '      ]' \
            '    }' \
            '  ]' \
            '}' \
            > /tmp/seaweed-s3.json
          chmod 600 /tmp/seaweed-s3.json

      - name: Build inventory
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          bash .github/scripts/build-deploy-inventory.sh

      - name: Validate core deploy files exist
        run: |
          set -euo pipefail
          
          echo "Checking required files for core deployment..."
          [[ -f /tmp/core-runtime.env ]] || { echo "✗ Missing /tmp/core-runtime.env"; exit 1; }
          [[ -f /tmp/seaweed-s3.json ]] || { echo "✗ Missing /tmp/seaweed-s3.json"; exit 1; }
          [[ -f /tmp/deploy-hosts.yml ]] || { echo "✗ Missing /tmp/deploy-hosts.yml"; exit 1; }

          nginx_bind_ip="$(grep '^NGINX_BIND_IP=' /tmp/core-runtime.env | cut -d= -f2- || true)"
          nginx_http_port="$(grep '^NGINX_HTTP_PORT=' /tmp/core-runtime.env | cut -d= -f2- || true)"
          nginx_https_bind_ip="$(grep '^NGINX_HTTPS_BIND_IP=' /tmp/core-runtime.env | cut -d= -f2- || true)"
          nginx_https_port="$(grep '^NGINX_HTTPS_PORT=' /tmp/core-runtime.env | cut -d= -f2- || true)"

          [[ "${nginx_bind_ip}" == "0.0.0.0" ]] || { echo "✗ NGINX_BIND_IP must be 0.0.0.0 for certbot HTTP-01"; exit 1; }
          [[ "${nginx_http_port}" == "80" ]] || { echo "✗ NGINX_HTTP_PORT must be 80 for certbot HTTP-01"; exit 1; }
          [[ "${nginx_https_bind_ip}" == "0.0.0.0" ]] || { echo "✗ NGINX_HTTPS_BIND_IP must be 0.0.0.0"; exit 1; }
          [[ "${nginx_https_port}" == "443" ]] || { echo "✗ NGINX_HTTPS_PORT must be 443"; exit 1; }
          
          echo "✓ All files present"
          echo ""
          echo "=== seaweed-s3.json (first 200 bytes) ==="
          head -c 200 /tmp/seaweed-s3.json
          echo ""

      - name: Deploy core
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
          BASE_DOMAIN: ${{ vars.BASE_DOMAIN }}
          CERTBOT_EMAIL: ${{ vars.CERTBOT_EMAIL }}
          CORE_RUNTIME_ENV_SOURCE_FILE: /tmp/core-runtime.env
          CORE_RUNTIME_SEAWEED_S3_SOURCE_FILE: /tmp/seaweed-s3.json
        run: |
          set -euo pipefail
          
          cd ansible
          
          ansible-playbook \
            -i /tmp/deploy-hosts.yml \
            playbooks/deploy.yml

  verify:
    name: Review deployed state
    needs: [deploy-core]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"

      - name: Prepare SSH material
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          bash .github/scripts/prepare-ssh.sh

      - name: Build inventory
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
        run: |
          set -euo pipefail
          bash .github/scripts/build-deploy-inventory.sh

      - name: Review deployed state
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
        run: |
          set -euo pipefail

          cd ansible

          ansible-playbook \
            -i /tmp/deploy-hosts.yml \
            playbooks/review.yml

  notify-success:
    name: Notify deployment success
    needs: [verify]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Summary
        run: |
          cat << 'EOF'
          ✓ Deployment successful
          
          Deployed stacks:
          - observability (Loki, Prometheus, Grafana)
          - personal (CouchDB)
          - core (Nginx, SeaweedFS)
          
          Next steps:
          1. Verify services at their configured ports
          2. Check logs: docker logs <container-name>
          3. Monitor: Check Grafana for metrics
          EOF

  notify-failure:
    name: Notify deployment failure
    needs: [validate, deploy-observability, deploy-personal, deploy-core, verify]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Report failure
        run: |
          cat << 'EOF'
          ✗ Deployment failed
          
          Check logs above for details. Possible issues:
          - Missing or invalid secrets in Infisical
          - SSH connectivity to production host
          - Docker compose configuration errors
          - Insufficient disk space or system resources
          
          Rollback:
          1. Review failed step logs
          2. Fix the issue
          3. Re-run this workflow
          EOF
          exit 1
