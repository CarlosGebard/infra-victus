name: Deploy All Stacks

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: true
        default: main
concurrency:
  group: production-deploy-all
  cancel-in-progress: false

env:
  DEPLOY_GIT_REF: ${{ inputs.git_ref || github.sha }}

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Validate all playbooks
        run: |
          set -euo pipefail
          
          bash tests/ansible/deploy-syntax-check.sh
          bash tests/ansible/deploy-observability-syntax-check.sh
          bash tests/ansible/deploy-llm-syntax-check.sh
          bash tests/ansible/preflight-syntax-check.sh
          bash tests/ansible/review-syntax-check.sh

      - name: Validate all docker-compose files
        run: |
          set -euo pipefail

          make compose-validate

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"
          secret-path: "${{ vars.INFISICAL_SECRET_PATH }}"

      - name: Assert all required secrets present
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
          SEAWEED_S3_ACCESS_KEY: ${{ env.SEAWEED_S3_ACCESS_KEY }}
          SEAWEED_S3_SECRET_KEY: ${{ env.SEAWEED_S3_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ env.REDIS_PASSWORD }}
          TAILSCALE_IPV4: ${{ env.TAILSCALE_IPV4 }}
          LLM_POSTGRES_PASSWORD: ${{ env.LLM_POSTGRES_PASSWORD }}
          LITELLM_DB_PASSWORD: ${{ env.LITELLM_DB_PASSWORD }}
          LITELLM_MASTER_KEY: ${{ env.LITELLM_MASTER_KEY }}
          LITELLM_SALT_KEY: ${{ env.LITELLM_SALT_KEY }}
          LITELLM_UI_PASSWORD: ${{ env.LITELLM_UI_PASSWORD }}
          LANGFUSE_DB_PASSWORD: ${{ env.LANGFUSE_DB_PASSWORD }}
          LANGFUSE_NEXTAUTH_SECRET: ${{ env.LANGFUSE_NEXTAUTH_SECRET }}
          LANGFUSE_SALT: ${{ env.LANGFUSE_SALT }}
          LANGFUSE_ENCRYPTION_KEY: ${{ env.LANGFUSE_ENCRYPTION_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ env.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ env.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail
          
          errors=()
          
          # Global secrets
          [[ -n "${PROD_HOST}" ]] || errors+=("Missing PROD_HOST")
          [[ -n "${PROD_SSH_PRIVATE_KEY}" ]] || errors+=("Missing PROD_SSH_PRIVATE_KEY")
          
          # Core secrets
          [[ -n "${SEAWEED_S3_ACCESS_KEY}" ]] || errors+=("Missing SEAWEED_S3_ACCESS_KEY")
          [[ -n "${SEAWEED_S3_SECRET_KEY}" ]] || errors+=("Missing SEAWEED_S3_SECRET_KEY")
          [[ -n "${POSTGRES_PASSWORD}" ]] || errors+=("Missing POSTGRES_PASSWORD")
          [[ "${#POSTGRES_PASSWORD}" -ge 16 ]] || errors+=("POSTGRES_PASSWORD must be at least 16 characters")
          [[ "${POSTGRES_PASSWORD}" != "change-me" ]] || errors+=("POSTGRES_PASSWORD must not use local default")
          [[ -n "${REDIS_PASSWORD}" ]] || errors+=("Missing REDIS_PASSWORD")
          [[ "${#REDIS_PASSWORD}" -ge 16 ]] || errors+=("REDIS_PASSWORD must be at least 16 characters")
          [[ "${REDIS_PASSWORD}" != "change-me" ]] || errors+=("REDIS_PASSWORD must not use local default")
          [[ -n "${TAILSCALE_IPV4}" ]] || errors+=("Missing TAILSCALE_IPV4")
          
          # LLM secrets
          [[ -n "${LLM_POSTGRES_PASSWORD}" ]] || errors+=("Missing LLM_POSTGRES_PASSWORD")
          [[ "${#LLM_POSTGRES_PASSWORD}" -ge 16 ]] || errors+=("LLM_POSTGRES_PASSWORD must be at least 16 characters")
          [[ "${LLM_POSTGRES_PASSWORD}" != "change-me" ]] || errors+=("LLM_POSTGRES_PASSWORD must not use local default")
          [[ -n "${LITELLM_DB_PASSWORD}" ]] || errors+=("Missing LITELLM_DB_PASSWORD")
          [[ "${#LITELLM_DB_PASSWORD}" -ge 16 ]] || errors+=("LITELLM_DB_PASSWORD must be at least 16 characters")
          [[ "${LITELLM_DB_PASSWORD}" != "change-me" ]] || errors+=("LITELLM_DB_PASSWORD must not use local default")
          [[ -n "${LITELLM_MASTER_KEY}" ]] || errors+=("Missing LITELLM_MASTER_KEY")
          [[ "${LITELLM_MASTER_KEY}" == sk-* ]] || errors+=("LITELLM_MASTER_KEY must start with sk-")
          [[ -n "${LITELLM_SALT_KEY}" ]] || errors+=("Missing LITELLM_SALT_KEY")
          [[ -n "${LITELLM_UI_PASSWORD}" ]] || errors+=("Missing LITELLM_UI_PASSWORD")
          [[ -n "${LANGFUSE_DB_PASSWORD}" ]] || errors+=("Missing LANGFUSE_DB_PASSWORD")
          [[ "${#LANGFUSE_DB_PASSWORD}" -ge 16 ]] || errors+=("LANGFUSE_DB_PASSWORD must be at least 16 characters")
          [[ "${LANGFUSE_DB_PASSWORD}" != "change-me" ]] || errors+=("LANGFUSE_DB_PASSWORD must not use local default")
          [[ -n "${LANGFUSE_NEXTAUTH_SECRET}" ]] || errors+=("Missing LANGFUSE_NEXTAUTH_SECRET")
          [[ -n "${LANGFUSE_SALT}" ]] || errors+=("Missing LANGFUSE_SALT")
          [[ -n "${LANGFUSE_ENCRYPTION_KEY}" ]] || errors+=("Missing LANGFUSE_ENCRYPTION_KEY")
          [[ "${#LANGFUSE_ENCRYPTION_KEY}" -eq 64 ]] || errors+=("LANGFUSE_ENCRYPTION_KEY must be 64 hex characters")
          [[ -n "${LANGFUSE_PUBLIC_KEY}" ]] || errors+=("Missing LANGFUSE_PUBLIC_KEY")
          [[ -n "${LANGFUSE_SECRET_KEY}" ]] || errors+=("Missing LANGFUSE_SECRET_KEY")
          
          if [[ ${#errors[@]} -gt 0 ]]; then
            printf '%s\n' "${errors[@]}" >&2
            exit 1
          fi

  preflight:
    name: Check Host Ready
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"
          secret-path: "${{ vars.INFISICAL_SECRET_PATH }}"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Prepare deploy context
        uses: ./.github/actions/prepare-deploy-context
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}

      - name: Check host deploy prerequisites
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
        run: |
          set -euo pipefail
          
          cd ansible
          
          ansible-playbook \
            -i /tmp/deploy-hosts.yml \
            playbooks/preflight.yml

  deploy-observability:
    name: Deploy Observability Stack
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"
          secret-path: "${{ vars.INFISICAL_SECRET_PATH }}"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Prepare deploy context
        uses: ./.github/actions/prepare-deploy-context
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}

      - name: Materialize observability runtime env
        run: |
          set -euo pipefail
          
          printf '%s\n' \
            'LOKI_BIND_IP=127.0.0.1' \
            'LOKI_HTTP_PORT=3100' \
            'PROMETHEUS_BIND_IP=127.0.0.1' \
            'PROMETHEUS_HTTP_PORT=9090' \
            > /tmp/observability-runtime.env
          chmod 600 /tmp/observability-runtime.env

      - name: Validate observability deploy files exist
        run: |
          set -euo pipefail
          
          [[ -f /tmp/observability-runtime.env ]] || { echo "✗ Missing /tmp/observability-runtime.env"; exit 1; }
          [[ -f /tmp/deploy-hosts.yml ]] || { echo "✗ Missing /tmp/deploy-hosts.yml"; exit 1; }

      - name: Deploy observability
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
          OBSERVABILITY_RUNTIME_ENV_SOURCE_FILE: /tmp/observability-runtime.env
        run: |
          set -euo pipefail
          
          cd ansible
          
          ansible-playbook \
            -i /tmp/deploy-hosts.yml \
            playbooks/deploy-observability.yml

  deploy-core:
    name: Deploy Core Stack
    needs: [deploy-observability]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"
          secret-path: "${{ vars.INFISICAL_SECRET_PATH }}"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Prepare deploy context
        uses: ./.github/actions/prepare-deploy-context
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}

      - name: Materialize core runtime env
        env:
          CORE_RUNTIME_ENV: ${{ vars.CORE_RUNTIME_ENV }}
          SEAWEED_S3_ACCESS_KEY: ${{ env.SEAWEED_S3_ACCESS_KEY }}
          SEAWEED_S3_SECRET_KEY: ${{ env.SEAWEED_S3_SECRET_KEY }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          REDIS_PASSWORD: ${{ env.REDIS_PASSWORD }}
        run: |
          set -euo pipefail
          
          if [[ -n "${CORE_RUNTIME_ENV:-}" ]]; then
            printf '%s\n' "$CORE_RUNTIME_ENV" > /tmp/core-runtime.env
          else
            printf '%s\n' \
              'NGINX_HTTP_PORT=80' \
              > /tmp/core-runtime.env
          fi

          grep -Ev '^(POSTGRES_PASSWORD|REDIS_PASSWORD)=' /tmp/core-runtime.env > /tmp/core-runtime.env.next || true
          printf 'POSTGRES_PASSWORD=%s\n' "${POSTGRES_PASSWORD}" >> /tmp/core-runtime.env.next
          printf 'REDIS_PASSWORD=%s\n' "${REDIS_PASSWORD}" >> /tmp/core-runtime.env.next
          mv /tmp/core-runtime.env.next /tmp/core-runtime.env

          chmod 600 /tmp/core-runtime.env
          
          # Seaweed S3 credentials
          printf '%s\n' \
            '{' \
            '  "identities": [' \
            '    {' \
            '      "name": "main",' \
            '      "credentials": [' \
            '        {' \
            "          \"accessKey\": \"${SEAWEED_S3_ACCESS_KEY}\"," \
            "          \"secretKey\": \"${SEAWEED_S3_SECRET_KEY}\"" \
            '        }' \
            '      ],' \
            '      "actions": [' \
            '        "Admin",' \
            '        "Read",' \
            '        "Tagging",' \
            '        "Write",' \
            '        "List"' \
            '      ]' \
            '    }' \
            '  ]' \
            '}' \
            > /tmp/seaweed-s3.json
          chmod 600 /tmp/seaweed-s3.json

      - name: Validate core deploy files exist
        run: |
          set -euo pipefail
          
          echo "Checking required files for core deployment..."
          [[ -f /tmp/core-runtime.env ]] || { echo "✗ Missing /tmp/core-runtime.env"; exit 1; }
          [[ -f /tmp/seaweed-s3.json ]] || { echo "✗ Missing /tmp/seaweed-s3.json"; exit 1; }
          [[ -f /tmp/deploy-hosts.yml ]] || { echo "✗ Missing /tmp/deploy-hosts.yml"; exit 1; }

          nginx_http_port="$(grep '^NGINX_HTTP_PORT=' /tmp/core-runtime.env | cut -d= -f2- || true)"
          [[ "${nginx_http_port}" == "80" ]] || { echo "✗ NGINX_HTTP_PORT must be 80"; exit 1; }
          
          echo "✓ All files present"
          echo ""
          echo "=== seaweed-s3.json (first 200 bytes) ==="
          head -c 200 /tmp/seaweed-s3.json
          echo ""

      - name: Deploy core
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
          CORE_RUNTIME_ENV_SOURCE_FILE: /tmp/core-runtime.env
          CORE_RUNTIME_SEAWEED_S3_SOURCE_FILE: /tmp/seaweed-s3.json
        run: |
          set -euo pipefail
          
          cd ansible
          
          ansible-playbook \
            -i /tmp/deploy-hosts.yml \
            playbooks/deploy.yml

  deploy-llm:
    name: Deploy LLM Stack
    needs: [deploy-core]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"
          secret-path: "${{ vars.INFISICAL_SECRET_PATH }}"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Prepare deploy context
        uses: ./.github/actions/prepare-deploy-context
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}

      - name: Materialize llm runtime env
        env:
          LLM_POSTGRES_PASSWORD: ${{ env.LLM_POSTGRES_PASSWORD }}
          LITELLM_DB_PASSWORD: ${{ env.LITELLM_DB_PASSWORD }}
          LITELLM_MASTER_KEY: ${{ env.LITELLM_MASTER_KEY }}
          LITELLM_SALT_KEY: ${{ env.LITELLM_SALT_KEY }}
          LITELLM_UI_PASSWORD: ${{ env.LITELLM_UI_PASSWORD }}
          LANGFUSE_DB_PASSWORD: ${{ env.LANGFUSE_DB_PASSWORD }}
          LANGFUSE_NEXTAUTH_SECRET: ${{ env.LANGFUSE_NEXTAUTH_SECRET }}
          LANGFUSE_SALT: ${{ env.LANGFUSE_SALT }}
          LANGFUSE_ENCRYPTION_KEY: ${{ env.LANGFUSE_ENCRYPTION_KEY }}
          LANGFUSE_PUBLIC_KEY: ${{ env.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_SECRET_KEY: ${{ env.LANGFUSE_SECRET_KEY }}
        run: |
          set -euo pipefail

          printf '%s\n' \
            'LLM_POSTGRES_DB=postgres' \
            'LLM_POSTGRES_USER=llm_admin' \
            "LLM_POSTGRES_PASSWORD=${LLM_POSTGRES_PASSWORD}" \
            'LITELLM_DB=litellm' \
            'LITELLM_DB_USER=litellm' \
            "LITELLM_DB_PASSWORD=${LITELLM_DB_PASSWORD}" \
            "LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}" \
            "LITELLM_SALT_KEY=${LITELLM_SALT_KEY}" \
            'LITELLM_UI_USERNAME=admin' \
            "LITELLM_UI_PASSWORD=${LITELLM_UI_PASSWORD}" \
            'LITELLM_WORKERS=2' \
            'LANGFUSE_DB=langfuse' \
            'LANGFUSE_DB_USER=langfuse' \
            "LANGFUSE_DB_PASSWORD=${LANGFUSE_DB_PASSWORD}" \
            'LANGFUSE_NEXTAUTH_URL=http://langfuse.victus.io' \
            "LANGFUSE_NEXTAUTH_SECRET=${LANGFUSE_NEXTAUTH_SECRET}" \
            "LANGFUSE_SALT=${LANGFUSE_SALT}" \
            "LANGFUSE_ENCRYPTION_KEY=${LANGFUSE_ENCRYPTION_KEY}" \
            'LANGFUSE_TELEMETRY_ENABLED=false' \
            'LANGFUSE_HOST=http://langfuse:3000' \
            "LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}" \
            "LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}" \
            > /tmp/llm-runtime.env
          chmod 600 /tmp/llm-runtime.env

      - name: Validate llm deploy files exist
        run: |
          set -euo pipefail

          [[ -f /tmp/llm-runtime.env ]] || { echo "✗ Missing /tmp/llm-runtime.env"; exit 1; }
          [[ -f /tmp/deploy-hosts.yml ]] || { echo "✗ Missing /tmp/deploy-hosts.yml"; exit 1; }

      - name: Deploy llm
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
          LLM_RUNTIME_ENV_SOURCE_FILE: /tmp/llm-runtime.env
        run: |
          set -euo pipefail

          cd ansible

          ansible-playbook \
            -i /tmp/deploy-hosts.yml \
            playbooks/deploy-llm.yml

  verify:
    name: Review deployed state
    needs: [deploy-llm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"
          secret-path: "${{ vars.INFISICAL_SECRET_PATH }}"

      - name: Prepare deploy context
        uses: ./.github/actions/prepare-deploy-context
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}

      - name: Review deployed state
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
        run: |
          set -euo pipefail

          cd ansible

          ansible-playbook \
            -i /tmp/deploy-hosts.yml \
            playbooks/review.yml

  notify-success:
    name: Notify deployment success
    needs: [verify]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Summary
        run: |
          cat << 'EOF'
          ✓ Deployment successful
          
          Deployed stacks:
          - observability (Loki, Prometheus)
          - core (nginx-private, nginx-public, SeaweedFS)
          
          Next steps:
          1. Verify services at their configured ports
          2. Check logs: docker logs <container-name>
          3. Monitor: Check container logs and Prometheus targets
          EOF

  notify-failure:
    name: Notify deployment failure
    needs: [validate, deploy-observability, deploy-core, verify]
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: Report failure
        run: |
          cat << 'EOF'
          ✗ Deployment failed
          
          Check logs above for details. Possible issues:
          - Missing or invalid secrets in Infisical
          - SSH connectivity to production host
          - Docker compose configuration errors
          - Insufficient disk space or system resources
          
          Rollback:
          1. Review failed step logs
          2. Fix the issue
          3. Re-run this workflow
          EOF
          exit 1
