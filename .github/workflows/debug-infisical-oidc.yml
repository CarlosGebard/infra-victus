name: Debug Infisical OIDC

on:
  workflow_dispatch:

concurrency:
  group: production-debug-infisical-oidc
  cancel-in-progress: false

jobs:
  debug:
    name: Debug GitHub OIDC and Infisical connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Assert required GitHub environment variables are present
        env:
          INFISICAL_IDENTITY_ID: ${{ vars.INFISICAL_IDENTITY_ID }}
          INFISICAL_PROJECT_SLUG: ${{ vars.INFISICAL_PROJECT_SLUG }}
          INFISICAL_ENV_SLUG: ${{ vars.INFISICAL_ENV_SLUG }}
        run: |
          set -euo pipefail

          [[ -n "${INFISICAL_IDENTITY_ID}" ]] || { echo "Missing INFISICAL_IDENTITY_ID"; exit 1; }
          [[ -n "${INFISICAL_PROJECT_SLUG}" ]] || { echo "Missing INFISICAL_PROJECT_SLUG"; exit 1; }
          [[ -n "${INFISICAL_ENV_SLUG}" ]] || { echo "Missing INFISICAL_ENV_SLUG"; exit 1; }

          echo "GitHub environment variables present"

      - name: Pull secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"

      - name: Verify action ran
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
        run: |
          set -euo pipefail

          [[ -n "${PROD_HOST}" ]] || { echo "Missing PROD_HOST from Infisical"; exit 1; }

          echo "Infisical action finished"
