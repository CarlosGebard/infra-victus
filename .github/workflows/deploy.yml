name: Deploy Single Stack

on:
  workflow_dispatch:
    inputs:
      stack:
        description: Stack to deploy (use deploy-all.yml for full rollout)
        required: true
        default: core
        type: choice
        options:
          - core
          - personal
          - observability
      git_ref:
        description: Git ref to deploy
        required: true
        default: main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production stack from Infisical runtime secrets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull deploy secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Select deploy targets
        run: |
          set -euo pipefail

          case "${{ inputs.stack }}" in
            core)
              echo "DEPLOY_PLAYBOOK=playbooks/deploy.yml" >> "$GITHUB_ENV"
              echo "DEPLOY_SYNTAX_CHECK=tests/ansible/deploy-syntax-check.sh" >> "$GITHUB_ENV"
              echo "DEPLOY_INVENTORY_FILE=/tmp/deploy-core-hosts.yml" >> "$GITHUB_ENV"
              echo "DEPLOY_RUNTIME_ENV_FILE=/tmp/core-runtime.env" >> "$GITHUB_ENV"
              ;;
            personal)
              echo "DEPLOY_PLAYBOOK=playbooks/deploy-personal.yml" >> "$GITHUB_ENV"
              echo "DEPLOY_SYNTAX_CHECK=tests/ansible/deploy-personal-syntax-check.sh" >> "$GITHUB_ENV"
              echo "DEPLOY_INVENTORY_FILE=/tmp/deploy-personal-hosts.yml" >> "$GITHUB_ENV"
              echo "DEPLOY_RUNTIME_ENV_FILE=/tmp/personal-runtime.env" >> "$GITHUB_ENV"
              ;;
            observability)
              echo "DEPLOY_PLAYBOOK=playbooks/deploy-observability.yml" >> "$GITHUB_ENV"
              echo "DEPLOY_SYNTAX_CHECK=tests/ansible/deploy-observability-syntax-check.sh" >> "$GITHUB_ENV"
              echo "DEPLOY_INVENTORY_FILE=/tmp/deploy-observability-hosts.yml" >> "$GITHUB_ENV"
              echo "DEPLOY_RUNTIME_ENV_FILE=/tmp/observability-runtime.env" >> "$GITHUB_ENV"
              ;;
            *)
              echo "Unsupported stack: ${{ inputs.stack }}" >&2
              exit 1
              ;;
          esac

      - name: Validate selected deploy playbook syntax
        run: "$DEPLOY_SYNTAX_CHECK"

      - name: Assert required deploy secrets are present
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
          COUCHDB_PASSWORD: ${{ env.COUCHDB_PASSWORD }}
          COUCHDB_USER: ${{ env.COUCHDB_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ env.GRAFANA_ADMIN_PASSWORD }}
          SEAWEED_S3_ACCESS_KEY: ${{ env.SEAWEED_S3_ACCESS_KEY }}
          SEAWEED_S3_SECRET_KEY: ${{ env.SEAWEED_S3_SECRET_KEY }}
        run: |
          set -euo pipefail

          [[ -n "${PROD_HOST}" ]] || { echo "Missing PROD_HOST"; exit 1; }
          [[ -n "${PROD_SSH_PRIVATE_KEY}" ]] || { echo "Missing PROD_SSH_PRIVATE_KEY"; exit 1; }

          case "${{ inputs.stack }}" in
            core)
              [[ -n "${SEAWEED_S3_ACCESS_KEY}" ]] || { echo "Missing SEAWEED_S3_ACCESS_KEY"; exit 1; }
              [[ -n "${SEAWEED_S3_SECRET_KEY}" ]] || { echo "Missing SEAWEED_S3_SECRET_KEY"; exit 1; }
              ;;
            personal)
              [[ -n "${COUCHDB_USER}" ]] || { echo "Missing COUCHDB_USER"; exit 1; }
              [[ -n "${COUCHDB_PASSWORD}" ]] || { echo "Missing COUCHDB_PASSWORD"; exit 1; }
              ;;
            observability)
              [[ -n "${GRAFANA_ADMIN_PASSWORD}" ]] || { echo "Missing GRAFANA_ADMIN_PASSWORD"; exit 1; }
              ;;
          esac

      - name: Prepare SSH material
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          if [[ -n "${PROD_SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -p "${PROD_SSH_PORT:-22}" -H "$PROD_HOST" >> "$HOME/.ssh/known_hosts"
          fi

          chmod 644 "$HOME/.ssh/known_hosts"

      - name: Materialize runtime files
        env:
          CORE_RUNTIME_ENV: ${{ vars.CORE_RUNTIME_ENV }}
          COUCHDB_PASSWORD: ${{ env.COUCHDB_PASSWORD }}
          COUCHDB_USER: ${{ env.COUCHDB_USER }}
          GRAFANA_ADMIN_PASSWORD: ${{ env.GRAFANA_ADMIN_PASSWORD }}
          SEAWEED_S3_ACCESS_KEY: ${{ env.SEAWEED_S3_ACCESS_KEY }}
          SEAWEED_S3_SECRET_KEY: ${{ env.SEAWEED_S3_SECRET_KEY }}
        run: |
          set -euo pipefail

          case "${{ inputs.stack }}" in
            core)
              if [[ -n "${CORE_RUNTIME_ENV:-}" ]]; then
                printf '%s\n' "$CORE_RUNTIME_ENV" > "$DEPLOY_RUNTIME_ENV_FILE"
              else
                printf '%s\n' \
                  'NGINX_BIND_IP=127.0.0.1' \
                  'NGINX_HTTP_PORT=8080' \
                  > "$DEPLOY_RUNTIME_ENV_FILE"
              fi
              printf '%s\n' \
                '{' \
                '  "identities": [' \
                '    {' \
                '      "name": "infra-prod",' \
                '      "credentials": [' \
                '        {' \
                "          \"accessKey\": \"${SEAWEED_S3_ACCESS_KEY}\"," \
                "          \"secretKey\": \"${SEAWEED_S3_SECRET_KEY}\"" \
                '        }' \
                '      ],' \
                '      "actions": [' \
                '        "Admin",' \
                '        "Read",' \
                '        "Write",' \
                '        "List"' \
                '      ]' \
                '    }' \
                '  ]' \
                '}' \
                > /tmp/seaweed-s3.json
              chmod 600 "$DEPLOY_RUNTIME_ENV_FILE" /tmp/seaweed-s3.json
              ;;
            personal)
              printf '%s\n' \
                "COUCHDB_USER=${COUCHDB_USER}" \
                "COUCHDB_PASSWORD=${COUCHDB_PASSWORD}" \
                > "$DEPLOY_RUNTIME_ENV_FILE"
              chmod 600 "$DEPLOY_RUNTIME_ENV_FILE"
              ;;
            observability)
              printf '%s\n' \
                'LOKI_BIND_IP=127.0.0.1' \
                'LOKI_HTTP_PORT=3100' \
                'PROMETHEUS_BIND_IP=127.0.0.1' \
                'PROMETHEUS_HTTP_PORT=9090' \
                'GRAFANA_ADMIN_USER=admin' \
                "GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}" \
                'GRAFANA_BIND_IP=127.0.0.1' \
                'GRAFANA_HTTP_PORT=3000' \
                'GRAFANA_ROOT_URL=http://127.0.0.1:8080/grafana/' \
                > "$DEPLOY_RUNTIME_ENV_FILE"
              chmod 600 "$DEPLOY_RUNTIME_ENV_FILE"
              ;;
          esac

      - name: Build temporary inventory
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
        run: |
          set -euo pipefail

          printf '%s\n' \
            'all:' \
            '  hosts:' \
            '    deploy_target:' \
            "      ansible_host: ${PROD_HOST}" \
            '      ansible_user: carlos' \
            "      ansible_port: ${PROD_SSH_PORT:-22}" \
            "      ansible_ssh_private_key_file: ${HOME}/.ssh/deploy_key" \
            > "$DEPLOY_INVENTORY_FILE"

      - name: Run selected deploy playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
          CORE_RUNTIME_ENV_SOURCE_FILE: ${{ inputs.stack == 'core' && '/tmp/core-runtime.env' || '' }}
          CORE_RUNTIME_SEAWEED_S3_SOURCE_FILE: ${{ inputs.stack == 'core' && '/tmp/seaweed-s3.json' || '' }}
          PERSONAL_RUNTIME_ENV_SOURCE_FILE: ${{ inputs.stack == 'personal' && '/tmp/personal-runtime.env' || '' }}
          OBSERVABILITY_RUNTIME_ENV_SOURCE_FILE: ${{ inputs.stack == 'observability' && '/tmp/observability-runtime.env' || '' }}
        run: |
          set -euo pipefail

          cd ansible

          ansible-playbook \
            -i "$DEPLOY_INVENTORY_FILE" \
            "$DEPLOY_PLAYBOOK"
