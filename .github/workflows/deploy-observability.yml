name: Deploy Observability Fast Track

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: true
        default: main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-observability.yml"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "ansible/**"
      - "compose/projects/observability/**"
      - "compose/configs/loki/**"
      - "compose/configs/prometheus/**"

concurrency:
  group: production-deploy-observability
  cancel-in-progress: false

env:
  DEPLOY_GIT_REF: ${{ inputs.git_ref || github.sha }}

jobs:
  deploy-observability:
    name: Deploy observability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"
          secret-path: "${{ vars.INFISICAL_SECRET_PATH }}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.PROD_HOST }}
        env:
          TAILSCALE_TAILNET: ${{ env.TAILSCALE_TAILNET }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Prepare deploy context
        uses: ./.github/actions/prepare-deploy-context
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}

      - name: Materialize observability runtime env
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ env.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s\n' \
            'LOKI_BIND_IP=127.0.0.1' \
            'LOKI_HTTP_PORT=3100' \
            'PROMETHEUS_BIND_IP=127.0.0.1' \
            'PROMETHEUS_HTTP_PORT=9090' \
            'GRAFANA_ADMIN_USER=admin' \
            "GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}" \
            'GRAFANA_BIND_IP=127.0.0.1' \
            'GRAFANA_HTTP_PORT=3000' \
            'GRAFANA_ROOT_URL=http://127.0.0.1:8080/grafana/' \
            > /tmp/observability-runtime.env
          chmod 600 /tmp/observability-runtime.env

      - name: Deploy observability
        env:
          ANSIBLE_HOST_KEY_CHECKING: "true"
          OBSERVABILITY_RUNTIME_ENV_SOURCE_FILE: /tmp/observability-runtime.env
        run: |
          set -euo pipefail
          cd ansible
          ansible-playbook -i /tmp/deploy-hosts.yml playbooks/deploy-observability.yml
