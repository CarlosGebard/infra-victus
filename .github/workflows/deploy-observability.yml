name: Deploy Observability Fast Track

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to deploy
        required: true
        default: main
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-observability.yml"
      - ".github/actions/**"
      - ".github/scripts/**"
      - "ansible/**"
      - "compose/projects/observability/**"
      - "compose/configs/loki/**"
      - "compose/configs/prometheus/**"

concurrency:
  group: production-deploy-observability
  cancel-in-progress: false

env:
  DEPLOY_GIT_REF: ${{ inputs.git_ref || github.sha }}

jobs:
  deploy-observability:
    name: Deploy observability
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.DEPLOY_GIT_REF }}

      - name: Pull secrets from Infisical
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "${{ vars.INFISICAL_IDENTITY_ID }}"
          project-slug: "${{ vars.INFISICAL_PROJECT_SLUG }}"
          env-slug: "${{ vars.INFISICAL_ENV_SLUG }}"
          secret-path: "${{ vars.INFISICAL_SECRET_PATH }}"

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ env.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci
          ping: ${{ env.PROD_HOST }}
        env:
          TAILSCALE_TAILNET: ${{ env.TAILSCALE_TAILNET }}

      - name: Prepare SSH
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
          PROD_SSH_KNOWN_HOSTS: ${{ env.PROD_SSH_KNOWN_HOSTS }}
          PROD_SSH_PORT: ${{ env.PROD_SSH_PORT }}
          PROD_SSH_PRIVATE_KEY: ${{ env.PROD_SSH_PRIVATE_KEY }}
        run: bash .github/scripts/prepare-ssh.sh

      - name: Materialize observability runtime env
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ env.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          printf '%s\n' \
            'LOKI_BIND_IP=127.0.0.1' \
            'LOKI_HTTP_PORT=3100' \
            'PROMETHEUS_BIND_IP=127.0.0.1' \
            'PROMETHEUS_HTTP_PORT=9090' \
            'GRAFANA_ADMIN_USER=admin' \
            "GRAFANA_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}" \
            'GRAFANA_BIND_IP=127.0.0.1' \
            'GRAFANA_HTTP_PORT=3000' \
            'GRAFANA_ROOT_URL=http://127.0.0.1:8080/grafana/' \
            > /tmp/observability-runtime.env
          chmod 600 /tmp/observability-runtime.env

      - name: Deploy observability over SSH
        env:
          SSH_PORT: ${{ env.PROD_SSH_PORT || 22 }}
          DEPLOY_SSH_USER: ${{ env.PROD_SSH_USER || 'carlos' }}
        run: |
          set -euo pipefail

          rm -rf /tmp/observability-deploy
          mkdir -p \
            /tmp/observability-deploy/apps/observability/loki \
            /tmp/observability-deploy/apps/observability/prometheus \
            /tmp/observability-deploy/secrets/runtime

          cp compose/projects/observability/compose.yml /tmp/observability-deploy/apps/observability/compose.yml
          cp compose/projects/observability/compose.prod.yml /tmp/observability-deploy/apps/observability/compose.prod.yml
          cp compose/configs/loki/config.yml /tmp/observability-deploy/apps/observability/loki/config.yml
          cp compose/configs/prometheus/prometheus.yml /tmp/observability-deploy/apps/observability/prometheus/prometheus.yml
          cp /tmp/observability-runtime.env /tmp/observability-deploy/secrets/runtime/observability.env

          tar -C /tmp/observability-deploy -czf /tmp/observability-deploy.tgz .
          scp -P "$SSH_PORT" /tmp/observability-deploy.tgz "$DEPLOY_SSH_USER@$PROD_HOST:/tmp/observability-deploy.tgz"
          ssh -p "$SSH_PORT" "$DEPLOY_SSH_USER@$PROD_HOST" 'sudo bash -s' <<'REMOTE'
          set -euo pipefail

          mkdir -p /srv/apps/observability /srv/secrets/runtime /srv/data/loki /srv/data/prometheus /srv/data/grafana /srv/logs
          tar -xzf /tmp/observability-deploy.tgz -C /srv
          chmod 600 /srv/secrets/runtime/observability.env
          ln -sfn /srv/secrets/runtime/observability.env /srv/apps/observability/.env
          docker network inspect infra_shared_backend >/dev/null 2>&1 || docker network create infra_shared_backend

          cd /srv/apps/observability
          docker compose --env-file /srv/secrets/runtime/observability.env -f compose.yml -f compose.prod.yml up -d
          rm -f /tmp/observability-deploy.tgz
          REMOTE
