name: Validate Infra

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to validate
        required: true
        default: main

concurrency:
  group: production-validate-infra
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Ansible and Infisical connectivity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.git_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull validation secrets from Infisical via OIDC
        uses: Infisical/secrets-action@v1.0.10
        with:
          method: "oidc"
          identity-id: "0a100e5d-1422-437e-b447-e032f32403fa"
          project-slug: "victus-main-server-qy-2z"
          env-slug: "prod"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Validate Ansible integrity
        run: ./tests/ansible/check.sh

      - name: Assert Infisical bootstrap contract is reachable
        env:
          BOOTSTRAP_HOST: ${{ env.BOOTSTRAP_HOST }}
          BOOTSTRAP_SSH_PRIVATE_KEY: ${{ env.BOOTSTRAP_SSH_PRIVATE_KEY }}
          BOOTSTRAP_SSH_USER: ${{ env.BOOTSTRAP_SSH_USER }}
        run: |
          set -euo pipefail

          [[ -n "${BOOTSTRAP_HOST}" ]] || { echo "Missing BOOTSTRAP_HOST from Infisical"; exit 1; }
          [[ -n "${BOOTSTRAP_SSH_USER}" ]] || { echo "Missing BOOTSTRAP_SSH_USER from Infisical"; exit 1; }
          [[ -n "${BOOTSTRAP_SSH_PRIVATE_KEY}" ]] || { echo "Missing BOOTSTRAP_SSH_PRIVATE_KEY from Infisical"; exit 1; }

          echo "Infisical connectivity OK"
