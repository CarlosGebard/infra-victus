name: Validate Infra

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref to validate
        required: true
        default: main
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "ansible/**"
      - "compose/**"
      - "ops/**"
      - "tests/ansible/**"
concurrency:
  group: production-validate-infra
  cancel-in-progress: false

env:
  VALIDATE_GIT_REF: ${{ inputs.git_ref || github.sha }}

jobs:
  validate:
    name: Validate static infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ env.VALIDATE_GIT_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: python -m pip install --upgrade pip ansible-core

      - name: Validate Ansible integrity
        run: ./tests/ansible/check.sh

      - name: Validate Compose integrity
        run: make compose-validate
